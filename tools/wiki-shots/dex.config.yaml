# zarashots dex config — mirrors dex/config.dev.yaml with the issuer and
# zara-web redirectURI repointed at this stack's port block (5756/3500).
# Static users = the seeded demo personas; passwords follow the dev
# convention (username + "123").
issuer: http://localhost:5756/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  grantTypes: ["authorization_code", "refresh_token", "client_credentials"]
  clientCredentialsEnabled: true

logger:
  level: info
  format: json

enablePasswordDB: true
staticPasswords:
  - email: "admin@zara.dev"
    hash: "$2b$10$erUgPFIRhvwgr1Q7hVUXt.2i5QLFL2ehOLtDkC1ZBdycAXIdMrjSS"
    username: "admin"
    userID: "admin-user"
  - email: "engineer@zara.dev"
    hash: "$2b$10$6YhlC8hDVTA9rHv174t1ge3L/0aG32rTXOQFpRBEKC7sLT/jIwHE6"
    username: "engineer"
    userID: "engineer-user"
  - email: "releasemgr@zara.dev"
    hash: "$2b$10$nQ5aYKvlvAEQwmEb7dNR3.ff2NeXDjCtjDSkA6TGLezG5fcCmi54u"
    username: "releasemgr"
    userID: "releasemgr-user"
  - email: "auditor@zara.dev"
    hash: "$2b$10$3.9lcn9rn8414oAbSK5axOyQ3GILKY/uCd4ZBEUfdTpI6Fi7rTIk6"
    username: "auditor"
    userID: "auditor-user"
  - email: "ns-engineer@zara.dev"
    hash: "$2b$10$99hiEU4dtLEgk2/7dz5Yru6NEy6cYSVJlL9N3WdXKfJRr7O8jrHlW"
    username: "ns-engineer"
    userID: "ns-engineer-user"

staticClients:
  - id: zara-web
    name: "Zara Management UI"
    public: true
    redirectURIs:
      - http://localhost:3500/auth/callback
  - id: zara-svc
    name: "Zara service account"
    secretEnv: DEX_ZARA_SVC_SECRET
  - id: zara-ci
    name: "Zara CI/automation"
    secretEnv: DEX_ZARA_CI_SECRET
