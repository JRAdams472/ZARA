[package]
name = "zara-migrate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "migrate",
] }
tokio = { version = "1", features = ["full"] }
