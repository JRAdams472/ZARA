# Zara dev stack — Z0 skeleton: data plane + dev IdP + observability.
# engine (:8400), mgmt (:8401), web (:3400) services are added at their
# milestones (Z2 / Z3 / Z5). All secrets interpolate from .env (gitignored)
# and compose fails closed on any unset ${VAR:?}.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: zara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: zara
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zara -d zara"]
      interval: 5s
      timeout: 3s
      retries: 12

  dex:
    # Dev IdP — auth-code+PKCE for the UI, client-credentials for service
    # accounts (zara-svc, zara-ci). Requires v2.46.0+ for
    # clientCredentialsEnabled. Prod repoints OIDC_ISSUER at the real IdP.
    image: dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DEX_ZARA_SVC_SECRET: ${DEX_ZARA_SVC_SECRET:?set DEX_ZARA_SVC_SECRET in .env}
      DEX_ZARA_CI_SECRET: ${DEX_ZARA_CI_SECRET:?set DEX_ZARA_CI_SECRET in .env}
      DEX_CLIENT_CREDENTIAL_GRANT_ENABLED_BY_DEFAULT: "true"
    volumes:
      - ./dex/config.dev.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5656:5556"

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      # First-boot only: seeds the admin password HASH and requires auth for
      # log ingestion. Ignored once the data dir exists — see .env.example.
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:?set SEQ_ADMIN_PASSWORD_HASH in .env}
      SEQ_FIRSTRUN_REQUIREAUTHENTICATIONFORHTTPINGESTION: "true"
    ports:
      - "5641:80"   # UI + ingest
    volumes:
      - seqdata:/seq/data

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    ports:
      - "19686:16686"  # UI
      - "4417:4317"    # OTLP gRPC
      - "4418:4318"    # OTLP HTTP

  # --- Setup profile (Z1): one-shot data-plane provisioning -------------
  # `docker compose --profile setup up -d` brings db healthy, applies all
  # migration sets + role passwords, then loads demo seeds. Both services
  # exit 0 on success; `compose --profile setup ps` shows them stopped.
  migrate:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Container DSNs reach the db service by name — not the host's
      # localhost:5532 DSNs from .env; compose builds them from secrets.
      DATABASE_URL: postgres://zara:${POSTGRES_PASSWORD:?}@db:5432/zara
      MIGRATE_DATABASE_URL: postgres://zara_migrate:${ZARA_MIGRATE_PASSWORD:?}@db:5432/zara
      ZARA_MIGRATE_PASSWORD: ${ZARA_MIGRATE_PASSWORD:?}
      ZARA_APP_DEV_PASSWORD: ${ZARA_APP_DEV_PASSWORD:?}
      ZARA_APP_QA_PASSWORD: ${ZARA_APP_QA_PASSWORD:?}
      ZARA_APP_UAT_PASSWORD: ${ZARA_APP_UAT_PASSWORD:?}
      ZARA_APP_PROD_PASSWORD: ${ZARA_APP_PROD_PASSWORD:?}
      ZARA_PROMOTE_PASSWORD: ${ZARA_PROMOTE_PASSWORD:?}
      ZARA_ENGINE_PASSWORD: ${ZARA_ENGINE_PASSWORD:?}
      ZARA_MGMT_PASSWORD: ${ZARA_MGMT_PASSWORD:?}
    restart: "no"

  # --- KMS (Z3): OpenBao transit for field encryption (ADR-0003) -------
  # Raft storage survives `compose down`; openbao-init auto-unseals and
  # mints the scoped zara-mgmt token into gitignored ./data/openbao.
  # Dev uses a 1-of-1 unseal share — Shamir/sealed ops are a runbook
  # concern, never this file's.
  openbao:
    profiles: ["setup", "mgmt"]
    image: openbao/openbao:latest
    command: server # entrypoint already passes -config=/openbao/config
    ports: ["8320:8200"]
    volumes:
      - ./openbao/config:/openbao/config:ro
      - openbao-data:/openbao/file
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://localhost:8200 -format=json | grep -q '\"sealed\":false' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  openbao-init:
    profiles: ["setup", "mgmt"]
    image: openbao/openbao:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./openbao/init.sh:/init.sh:ro
      - ./data/openbao:/out
    depends_on:
      openbao:
        condition: service_started
    restart: "no"

  seed:
    profiles: ["setup"]
    image: postgres:18-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./seed:/seed:ro
    environment:
      PGPASSWORD: ${ZARA_MIGRATE_PASSWORD:?}
    # Seeds run as zara_migrate — the only role that writes zara_control;
    # FORCE RLS still requires SET zara.tenant_id for env-schema DML.
    entrypoint: ["sh", "-c"]
    command:
      - "psql postgres://zara_migrate@db:5432/zara -v ON_ERROR_STOP=1 -f /seed/001_demo_tenants.sql -f /seed/002_demo_fees.sql -f /seed/003_demo_grants.sql"
    restart: "no"

  # --- Execution engine (Z2): eval API on :8400 --------------------------
  # Dev auth runs on an ephemeral static JWKS — generate it first:
  #   cargo run -p zara-engine --bin zara_devtoken -- \
  #     --tenant-id <tenant-uuid> --jwks-out .devkeys/jwks.json --key-out .devkeys/dev.pem
  # (see docs/engine.md). For a real issuer drop ZARA_JWKS_FILE and point
  # OIDC_ISSUER/OIDC_JWKS_URL at the IdP instead.
  engine:
    profiles: ["engine"]
    build:
      context: .
      dockerfile: Dockerfile.engine
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false # also startable without the setup profile
    ports:
      - "8400:8400"
      - "9443:9443" # gRPC EngineControl (ADR-0004); h2c in dev
    volumes:
      - ./.devkeys:/run/devkeys:ro
    environment:
      PORT: "8400"
      GRPC_PORT: "9443"
      # GRPC_TLS_CERT / GRPC_TLS_KEY (set together) flip the listener to TLS 1.3.
      ENGINE_DATABASE_URL: postgres://zara_engine:${ZARA_ENGINE_PASSWORD:?}@db:5432/zara
      ZARA_JWKS_FILE: /run/devkeys/jwks.json
      OIDC_ISSUER: ${ZARA_DEV_ISSUER:-zara-devtoken}
      OIDC_AUDIENCE: ${ZARA_DEV_AUDIENCE:-zara-engine}
      SNAPSHOT_POLL_MS: ${SNAPSHOT_POLL_MS:-30000}
    restart: unless-stopped

  # --- Management plane (Z3): Node/TS gatekeeper on :8401 ---------------
  # Shares the .devkeys JWKS contract with the engine, but its audience is
  # zara-mgmt — mint a mgmt token with:
  #   node mgmt/scripts/devtoken.mjs --tenant-id <uuid> --envs dev,qa,uat,prod \
  #     --aud zara-mgmt --key-in .devkeys/dev.pem --jwks-out .devkeys/jwks.json
  # (or crates' zara_devtoken with matching --audience). See docs/engine.md.
  mgmt:
    profiles: ["mgmt"]
    build:
      context: .
      dockerfile: Dockerfile.mgmt
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false
      openbao-init:
        # required:false — without the setup/mgmt profiles the service
        # still boots; secrets routes then answer 503 (no fallback).
        condition: service_completed_successfully
        required: false
    ports:
      - "8401:8401"
    volumes:
      - ./.devkeys:/run/devkeys:ro
      - ./data/openbao:/run/openbao:ro
    environment:
      PORT: "8401"
      MGMT_DATABASE_URL: postgres://zara_mgmt:${ZARA_MGMT_PASSWORD:?}@db:5432/zara
      RULES_DATABASE_URL: postgres://zara_app_dev:${ZARA_APP_DEV_PASSWORD:?}@db:5432/zara
      PROMOTE_DATABASE_URL: postgres://zara_promote:${ZARA_PROMOTE_PASSWORD:?}@db:5432/zara
      ZARA_JWKS_FILE: /run/devkeys/jwks.json
      OIDC_ISSUER: ${ZARA_DEV_ISSUER:-zara-devtoken}
      OIDC_AUDIENCE: ${ZARA_MGMT_AUDIENCE:-zara-mgmt}
      KMS_URL: http://openbao:8200
      KMS_TOKEN_FILE: /run/openbao/api-token
      # ADR-0004 publish push → engine:9443. Unset → published:false and
      # the engine poller converges. Service JWT (aud=zara-engine, tenant
      # + env claims) — mint per-tenant for dev with the shared dev key:
      #   node mgmt/scripts/devtoken.mjs --tenant-id <uuid> --envs dev,qa,uat,prod \
      #     --aud zara-engine --key-in .devkeys/dev.pem > .devkeys/grpc-svc.jwt
      ENGINE_GRPC_ADDR: engine:9443
      ENGINE_GRPC_PROTO: /app/proto/zara/engine/v1/engine.proto
      ENGINE_GRPC_TOKEN_FILE: /run/devkeys/grpc-svc.jwt
    restart: unless-stopped

  # --- Management console (Z5): Next.js BFF on :3400 ---------------------
  # Auth-code+PKCE through dex (public client zara-web). Dex proves the
  # human's identity but cannot inject Zara claims, so the BFF mints a
  # short-lived zara-devtoken bearer per request with the shared dev key —
  # the same contract as mgmt/scripts/devtoken.mjs. Prod repoints the OIDC
  # URLs at the real IdP (claims injected natively) and drops
  # ZARA_DEV_KEY_FILE → passthrough, no code change.
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      mgmt:
        condition: service_started
        required: false
      dex:
        condition: service_started
    ports:
      - "3400:3400"
    volumes:
      - ./.devkeys:/run/devkeys:ro
    environment:
      PORT: "3400"
      API_URL: http://mgmt:8401
      SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET in .env}
      # Browser-facing authorize vs server-side token exchange — the
      # browser reaches dex on localhost:5656, the container on dex:5556.
      OIDC_AUTHORIZE_URL: http://localhost:5656/dex/auth
      OIDC_TOKEN_URL: http://dex:5556/dex/token
      OIDC_CLIENT_ID: zara-web
      OIDC_REDIRECT_URI: http://localhost:3400/auth/callback
      # Dev token exchange (see header). Claims defaults cover every dex
      # user on the ACME demo tenant; per-user env scope narrows further.
      ZARA_DEV_KEY_FILE: /run/devkeys/dev.pem
      ZARA_TOKEN_AUDIENCE: zara-mgmt
      DEV_TENANT_ID: aa5ce000-0000-4000-8000-0000000000ac
      DEV_ENVS: dev,qa,uat,prod
      DEV_CLAIMS_MAP: '{"auditor@zara.dev":{"envs":["qa","uat"]},"engineer@zara.dev":{"envs":["dev","qa","uat"]}}'
    restart: unless-stopped

volumes:
  pgdata:
  seqdata:
  openbao-data:
