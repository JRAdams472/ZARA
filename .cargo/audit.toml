[advisories]
ignore = [
    # zip 8.x extraction advisories — zen-engine 2.1.x pins `zip = "8"` and no
    # upstream release takes zip 9 yet. All three advisories live in archive
    # *extraction* (`ZipArchive::extract`/`ZipStreamReader::extract`). Zara
    # loads JDM as JSON from Postgres snapshots via MemoryLoader/CachedLoader;
    # no filesystem or bundle loader is ever constructed, so the vulnerable
    # path is unreachable. Revisit when zen-engine ships zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # Same zip 8.x extraction class as the three above — `ZipArchive::extract`
    # aborts on a symlink entry's unbounded declared-size reservation (DoS
    # only; fix shipped in zip 9, which zen-engine can't take). Same
    # unreachable-path justification applies.
    "RUSTSEC-2026-0429",
    # Marvin timing oracle — affects RSA *decryption* (PKCS#1 v1.5 unwrap
    # oracles). `rsa` arrives transitively via zen-engine's reqsign
    # cloud-storage decision loaders (never instantiated) and is used
    # directly by zara_devtoken for local ephemeral key *generation* only —
    # no decryption oracle exists anywhere in the tree, and the advisory
    # notes local non-network use is unaffected. No fix released.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys bundled-SQLite advisory — `sqlx-sqlite`/`libsqlite3-sys`
    # exist in Cargo.lock as phantom nodes only: `sqlx`'s `sqlite` feature is
    # never enabled (`postgres` only on both crates; `cargo tree -i
    # sqlx-sqlite --target all` is empty), so the bundled C code never compiles
    # into a Zara binary. The vector also requires opening an
    # attacker-crafted `.db`+`-wal` pair — no sqlite file path exists anywhere
    # in code or deployment (Postgres-only). `sqlx-sqlite` 0.8.x pins
    # `libsqlite3-sys ~0.30`; no sqlx release takes 0.39 yet.
    "RUSTSEC-2026-0459",
]
