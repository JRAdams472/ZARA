# MPE-113 Z0 — secret scanning for Zara (same gate as MPEx/LOLA).
#
# .env.example ships placeholders ONLY (empty values / __NAME__ markers) —
# it exists to document the variable names, so allow it outright rather
# than let placeholder edits flake the scan. Everything else is scanned.

[allowlist]
description = "Zara placeholder files + test fixtures"
paths = [
  '''\.env\.example''',
]
