name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  bootstrap:
    name: Bootstrap — repo hygiene (Z0; real build jobs land with code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets in tracked files
        run: |
          if grep -rElZ --exclude='.env.example' --exclude-dir=.git \
               '(SECRET|PASSWORD|TOKEN|KEY)=[^ "$_]{8,}' . | grep -qz .; then
            echo "Possible committed secret found:"; exit 1
          fi
      - name: Compose file validates
        # ${VAR:?} interpolation fails closed by design — feed throwaway
        # values so the check validates structure, not secrets.
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DEX_ZARA_SVC_SECRET: ci-placeholder
          DEX_ZARA_CI_SECRET: ci-placeholder
          SEQ_ADMIN_PASSWORD_HASH: ci-placeholder
          ZARA_MIGRATE_PASSWORD: ci-placeholder
          ZARA_APP_DEV_PASSWORD: ci-placeholder
          ZARA_APP_QA_PASSWORD: ci-placeholder
          ZARA_APP_UAT_PASSWORD: ci-placeholder
          ZARA_APP_PROD_PASSWORD: ci-placeholder
          ZARA_PROMOTE_PASSWORD: ci-placeholder
          ZARA_ENGINE_PASSWORD: ci-placeholder
          ZARA_MGMT_PASSWORD: ci-placeholder
        run: docker compose --profile setup --profile engine --profile mgmt config --quiet
      - name: Megaplan + ADRs present
        run: |
          test -f docs/megaplan-mpe-113.md
          test -f docs/adr/README.md
          test -f AGENTS.md

  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  db:
    name: DB — migrate + isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zara
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: zara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zara -d zara"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: zara
      POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgres://zara:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      MIGRATE_DATABASE_URL: postgres://zara_migrate:mig-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      # Per-run throwaway role passwords — nothing static in the workflow.
      ZARA_MIGRATE_PASSWORD: mig-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_DEV_PASSWORD: dev-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_QA_PASSWORD: qa-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_UAT_PASSWORD: uat-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_PROD_PASSWORD: prod-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_PROMOTE_PASSWORD: pro-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_ENGINE_PASSWORD: eng-${{ github.run_id }}-${{ github.run_attempt }}
      ENGINE_DATABASE_URL: postgres://zara_engine:eng-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations (bootstrap + control + env ×4)
        run: cargo run -p zara-migrate -- --set-role-passwords
      - name: Apply demo seeds
        # Same files/command as the compose `seed` service so CI and the
        # dev stack stay identical; makes t07 verify (not skip).
        run: psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f seed/001_demo_tenants.sql -f seed/002_demo_fees.sql
      - name: Isolation suite
        run: bash tests/isolation/run.sh
      - name: Engine loader test (zara_engine role + RLS)
        run: cargo test -p zara-engine --test loader
      - name: Eval latency bench (p95 < 15 ms)
        run: cargo run -p zara-engine --bin zara_bench -- --iterations 200

  engine:
    name: Engine — service tests + HTTP bench
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zara
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: zara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zara -d zara"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: zara
      POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgres://zara:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      MIGRATE_DATABASE_URL: postgres://zara_migrate:mig-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      ZARA_MIGRATE_PASSWORD: mig-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_DEV_PASSWORD: dev-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_QA_PASSWORD: qa-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_UAT_PASSWORD: uat-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_PROD_PASSWORD: prod-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_PROMOTE_PASSWORD: pro-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_ENGINE_PASSWORD: eng-${{ github.run_id }}-${{ github.run_attempt }}
      ENGINE_DATABASE_URL: postgres://zara_engine:eng-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations (bootstrap + control + env ×4)
        run: cargo run -p zara-migrate -- --set-role-passwords
      - name: Apply demo seeds
        run: psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f seed/001_demo_tenants.sql -f seed/002_demo_fees.sql
      - name: Service integration tests (JWT gate, PII, seeded eval)
        run: cargo test -p zara-engine
      - name: HTTP eval bench (p95 < 15 ms)
        run: bash tests/latency/bench.sh --tenant acme-mortgage --iterations 200

  mgmt:
    name: Mgmt — npm gates + service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zara
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: zara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zara -d zara"
          --health-interval 5s --health-timeout 3s --health-retries 12
      openbao:
        # Dev-mode (ephemeral, auto-unsealed) — CI-only provisioning;
        # the compose stack uses raft + openbao/init.sh instead.
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: zara
      POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgres://zara:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      MIGRATE_DATABASE_URL: postgres://zara_migrate:mig-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      ZARA_MIGRATE_PASSWORD: mig-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_DEV_PASSWORD: dev-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_QA_PASSWORD: qa-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_UAT_PASSWORD: uat-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_APP_PROD_PASSWORD: prod-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_PROMOTE_PASSWORD: pro-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_ENGINE_PASSWORD: eng-${{ github.run_id }}-${{ github.run_attempt }}
      ZARA_MGMT_PASSWORD: mgmt-${{ github.run_id }}-${{ github.run_attempt }}
      MGMT_DATABASE_URL: postgres://zara_mgmt:mgmt-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/zara
      KMS_URL: http://localhost:8200
      KMS_TOKEN_FILE: ${{ github.workspace }}/data/openbao/api-token
      BAO_ROOT: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # zara-migrate binary only — no clippy/test here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mgmt/package-lock.json
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations (bootstrap + control + env ×4)
        run: cargo run -p zara-migrate -- --set-role-passwords
      - name: Apply demo seeds
        run: psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f seed/001_demo_tenants.sql -f seed/002_demo_fees.sql
      - name: Provision transit mount + scoped token (dev OpenBao)
        run: |
          set -euo pipefail
          # Wait for dev-mode unseal
          for i in $(seq 1 30); do
            curl -sf "$KMS_URL/v1/sys/seal-status" | grep -q '"sealed":false' && break
            [ "$i" = 30 ] && { echo "openbao never unsealed"; exit 1; }
            sleep 2
          done
          # Same contract openbao/init.sh enforces: transit mount, the
          # aes256-gcm96 field key, the crypto-ops-only zara-mgmt policy,
          # and a scoped token written to the (gitignored) data dir.
          curl -sf -H "X-Vault-Token: $BAO_ROOT" -X PUT \
            -d '{"type":"transit"}' "$KMS_URL/v1/sys/mounts/zara-transit"
          curl -sf -H "X-Vault-Token: $BAO_ROOT" -X POST \
            -d '{"type":"aes256-gcm96"}' "$KMS_URL/v1/zara-transit/keys/zara-mgmt-secrets"
          curl -sf -H "X-Vault-Token: $BAO_ROOT" -X PUT \
            -d '{"policy":"path \"zara-transit/encrypt/*\" { capabilities = [\"create\",\"update\"] }\npath \"zara-transit/decrypt/*\" { capabilities = [\"create\",\"update\"] }\npath \"zara-transit/rewrap/*\" { capabilities = [\"create\",\"update\"] }\npath \"sys/seal-status\" { capabilities = [\"read\"] }"}' \
            "$KMS_URL/v1/sys/policy/zara-mgmt"
          mkdir -p data/openbao
          curl -sf -H "X-Vault-Token: $BAO_ROOT" -X POST \
            -d '{"policies":["zara-mgmt"],"period":"24h"}' \
            "$KMS_URL/v1/auth/token/create" \
            | grep -o '"client_token":"[^"]*"' | cut -d'"' -f4 \
            > "$KMS_TOKEN_FILE"
          [ -s "$KMS_TOKEN_FILE" ] || { echo "scoped token mint failed"; exit 1; }
      - name: npm ci
        working-directory: mgmt
        run: npm ci
      - name: Lint
        working-directory: mgmt
        run: npm run lint
      - name: Typecheck (src + test)
        working-directory: mgmt
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Unit + integration tests (zara_mgmt role, real RLS)
        working-directory: mgmt
        run: npm test
      - name: Coverage floor (80%/area — covercheck)
        working-directory: mgmt
        run: |
          npm run coverage
          npm run coverage:check
      - name: Build
        working-directory: mgmt
        run: npm run build

  deps:
    name: Deps — cargo audit + filtered npm audit
    runs-on: ubuntu-latest
    permissions:
      # audit-check publishes findings as a check run.
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mgmt/package-lock.json
      - name: npm ci (mgmt)
        working-directory: mgmt
        run: npm ci
      - name: Filtered npm audit gate (MPE-123 pattern)
        working-directory: mgmt
        run: npm run audit:gate

  # Z2 added: rust job (fmt / clippy / test) + db job (migrate, isolation,
  #   loader test, zara-bench) + engine job (service tests, HTTP bench).
  # Z3 adds: mgmt job (npm ci / lint / typecheck / test / build on real
  #   Postgres + zara_mgmt role) and deps job (rustsec/audit-check +
  #   filtered npm-audit gate — MPE-123 pattern, exceptions justified in
  #   mgmt/npm-audit-exceptions.json).
  # Z5 adds: web job + e2e job (Playwright seeded stack — Dex +
  #   seeded Postgres + api + web, per-run generated secrets).
  # Z6 adds: sonarqube scan + quality-gate (MPE-135 pattern).
