version: 2
updates:
  # Rust — Cargo.toml + Cargo.lock at the repo root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
      # The gRPC stack only moves in lockstep — prost codegen, the tonic
      # runtime, and tonic-prost(-build) must share a version or the
      # generated types stop satisfying Message/codec traits (MPE-199).
      grpc-family:
        patterns: ["tonic*", "prost*"]

  # Workflow actions (actions/*, gitleaks-action, audit-check, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base images in the root and service Dockerfiles.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # npm ecosystems are added when their package.json lands —
  # services/mgmt (Z3) and clients/web (Z5); uncomment at that milestone:
  # - package-ecosystem: npm
  #   directory: /services/mgmt
  #   schedule: { interval: weekly }
  #   open-pull-requests-limit: 5
  #   groups:
  #     npm-minor-patch:
  #       update-types: [minor, patch]
