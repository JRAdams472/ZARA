sonar.projectKey=zara
sonar.projectName=Zara
# Scanner runs over the whole checkout; sources/tests scope the analysis.
# No Rust analyzer in Community Build — Rust sources index for metrics and
# duplication only; TypeScript/JS analysis is fully native.
sonar.sources=src,services,clients,migrations,seed,dex,proto
sonar.tests=tests,e2e
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=services/mgmt/coverage/lcov.info,clients/web/coverage/lcov.info
